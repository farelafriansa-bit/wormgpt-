<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0000">
<title>WormGPT</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#0d0000;
  --paper:#fff8f0;
  --panel:#fff0e8;
  --red:#cc1a00;
  --red2:#ff2200;
  --red3:#ff6644;
  --yellow:#ffe000;
  --cream:#fff5dc;
  --border:3px solid var(--ink);
  --shadow:4px 4px 0 var(--ink);
  --shadow-sm:2px 2px 0 var(--ink);
  --mono:'JetBrains Mono',monospace;
  --comic:'Comic Neue',cursive;
  --title:'Bangers',cursive;
}

html{height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--comic);
  font-size:15px;
  display:flex;
  flex-direction:column;
  height:100dvh;
  overflow:hidden;
  background-image:
    radial-gradient(circle, #ddd 1px, transparent 1px);
  background-size:18px 18px;
}

/* ─── HEADER ─── */
header{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  height:60px;
  background:var(--red);
  border-bottom:3px solid var(--ink);
  position:relative;
  z-index:20;
  box-shadow:0 3px 0 var(--ink);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-skull{
  width:38px;height:38px;
  background:var(--yellow);
  border:2.5px solid var(--ink);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:var(--shadow-sm);
  flex-shrink:0;
}

.logo-text{
  font-family:var(--title);
  font-size:26px;
  letter-spacing:2px;
  color:#fff;
  text-shadow:2px 2px 0 var(--ink);
  line-height:1;
}
.logo-text em{
  font-style:normal;
  color:var(--yellow);
}

.header-right{display:flex;align-items:center;gap:8px}

.online-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--yellow);
  border:2px solid var(--ink);
  border-radius:99px;
  padding:3px 10px;
  font-family:var(--title);
  font-size:13px;
  letter-spacing:1px;
  color:var(--ink);
  box-shadow:var(--shadow-sm);
}
.online-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:#00cc44;
  border:1.5px solid var(--ink);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.btn-trash{
  width:36px;height:36px;
  background:var(--yellow);
  border:2.5px solid var(--ink);
  border-radius:8px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
  box-shadow:var(--shadow-sm);
  transition:transform .1s;
  flex-shrink:0;
}
.btn-trash:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn-trash:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

/* ─── MESSAGES AREA ─── */
#messages{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px 12px 8px;
  display:flex;
  flex-direction:column;
  gap:14px;
  position:relative;
  z-index:1;
  -webkit-overflow-scrolling:touch;
}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--red);border:1px solid var(--ink);border-radius:99px}

/* ─── EMPTY STATE ─── */
#empty-state{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  gap:16px;
  text-align:center;
}

.empty-panel{
  background:var(--cream);
  border:3px solid var(--ink);
  border-radius:16px;
  padding:24px 20px 20px;
  max-width:340px;
  width:100%;
  box-shadow:var(--shadow);
  position:relative;
}
.empty-panel::before{
  content:'★ WormGPT ★';
  position:absolute;
  top:-13px;left:50%;transform:translateX(-50%);
  background:var(--yellow);
  border:2.5px solid var(--ink);
  border-radius:99px;
  padding:2px 14px;
  font-family:var(--title);
  font-size:13px;
  letter-spacing:1px;
  white-space:nowrap;
}
.empty-worm{
  font-size:52px;
  animation:float 3s ease-in-out infinite;
  display:block;
  margin-bottom:4px;
}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(5deg)}}

.empty-title{
  font-family:var(--title);
  font-size:28px;
  letter-spacing:2px;
  color:var(--red);
  text-shadow:2px 2px 0 var(--ink);
}
.empty-sub{
  font-size:13.5px;
  color:#555;
  line-height:1.6;
  margin-top:4px;
}

/* ZAP decoration */
.zap-line{
  display:flex;align-items:center;gap:8px;
  margin:10px 0 4px;
  color:var(--ink);
  font-family:var(--title);
  font-size:14px;
  letter-spacing:1px;
}
.zap-line::before,.zap-line::after{
  content:'';flex:1;height:2px;background:var(--ink);
}

.chips{
  display:flex;flex-wrap:wrap;gap:7px;justify-content:center;
  margin-top:2px;
}
.chip{
  background:#fff;
  border:2.5px solid var(--ink);
  border-radius:8px;
  color:var(--ink);
  padding:6px 12px;
  cursor:pointer;
  font-size:12px;
  font-family:var(--comic);
  font-weight:700;
  box-shadow:var(--shadow-sm);
  transition:all .12s;
  white-space:nowrap;
}
.chip:hover{background:var(--yellow);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.chip:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}

/* ─── MESSAGE ROWS ─── */
.msg-row{animation:popIn .22s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* AI — speech bubble pointing left */
.msg-row.ai{
  display:flex;align-items:flex-start;gap:10px;
  padding:0 4px 0 0;
}

.ai-face{
  width:38px;height:38px;
  border-radius:50%;
  background:var(--red);
  border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  flex-shrink:0;
  box-shadow:var(--shadow-sm);
  margin-top:2px;
}

.ai-bubble-wrap{flex:1;display:flex;flex-direction:column;gap:4px}

.ai-bubble{
  background:var(--cream);
  border:2.5px solid var(--ink);
  border-radius:4px 16px 16px 16px;
  padding:10px 14px;
  position:relative;
  box-shadow:var(--shadow-sm);
  color:var(--ink);
  font-size:14.5px;
  line-height:1.7;
  word-break:break-word;
}
/* triangle tail */
.ai-bubble::before{
  content:'';
  position:absolute;
  left:-10px;top:10px;
  width:0;height:0;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-right:10px solid var(--ink);
}
.ai-bubble::after{
  content:'';
  position:absolute;
  left:-6px;top:11px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-right:8px solid var(--cream);
}

/* USER — bubble pointing right */
.msg-row.user{
  display:flex;
  justify-content:flex-end;
  align-items:flex-end;
  gap:8px;
  padding:0 0 0 40px;
}

.user-bubble{
  background:var(--red);
  border:2.5px solid var(--ink);
  border-radius:16px 4px 16px 16px;
  padding:10px 14px;
  color:#fff;
  font-size:14.5px;
  line-height:1.65;
  max-width:80%;
  word-break:break-word;
  box-shadow:var(--shadow-sm);
  position:relative;
}
.user-bubble::before{
  content:'';
  position:absolute;
  right:-10px;top:10px;
  width:0;height:0;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-left:10px solid var(--ink);
}
.user-bubble::after{
  content:'';
  position:absolute;
  right:-6px;top:11px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-left:8px solid var(--red);
}

.msg-time{
  font-size:10px;
  color:#999;
  font-family:var(--mono);
  margin-top:3px;
}
.msg-row.user .msg-time{text-align:right}
.msg-row.ai .msg-time{margin-left:48px}

/* ─── CODE BLOCK ─── */
.ai-bubble pre{
  background:#1a0000;
  border:2.5px solid var(--ink);
  border-left:5px solid var(--red);
  border-radius:8px;
  padding:12px 14px;
  font-family:var(--mono);
  font-size:12px;
  overflow-x:auto;
  margin:10px 0 4px;
  white-space:pre;
  color:#ffccbb;
  -webkit-overflow-scrolling:touch;
  position:relative;
}
.ai-bubble code{
  font-family:var(--mono);
  font-size:12.5px;
  color:var(--red2);
  background:rgba(204,26,0,.1);
  padding:1px 5px;
  border-radius:4px;
  border:1px solid rgba(204,26,0,.25);
}
.ai-bubble pre code{background:transparent;color:#ffccbb;padding:0;border:none}

.pre-wrap{position:relative}
.copy-btn{
  position:absolute;
  top:8px;right:8px;
  background:var(--yellow);
  border:2px solid var(--ink);
  color:var(--ink);
  font-family:var(--title);
  font-size:11px;
  letter-spacing:.5px;
  padding:3px 9px;
  border-radius:5px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:all .1s;
}
.copy-btn:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.copy-btn:active{transform:translate(1px,1px);box-shadow:none}

/* ─── TYPING / THINKING ─── */
.typing-row{
  display:flex;align-items:center;gap:10px;
  padding:0 4px;
}
.think-face{
  width:38px;height:38px;
  border-radius:50%;
  background:var(--red);
  border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.think-bubble{
  background:var(--cream);
  border:2.5px solid var(--ink);
  border-radius:4px 16px 16px 16px;
  padding:10px 18px;
  box-shadow:var(--shadow-sm);
  position:relative;
  display:flex;align-items:center;gap:5px;
}
.think-bubble::before{
  content:'';position:absolute;left:-10px;top:10px;
  width:0;height:0;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-right:10px solid var(--ink);
}
.think-bubble::after{
  content:'';position:absolute;left:-6px;top:11px;
  width:0;height:0;
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
  border-right:8px solid var(--cream);
}
.tdot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--red);
  border:1.5px solid var(--ink);
  animation:tdot 1s ease-in-out infinite;
}
.tdot:nth-child(2){animation-delay:.15s}
.tdot:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,80%,100%{transform:scale(.7);opacity:.4}40%{transform:scale(1.1);opacity:1}}

/* ─── INPUT AREA ─── */
.input-area{
  flex-shrink:0;
  background:var(--ink);
  border-top:3px solid var(--ink);
  padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  position:relative;
  z-index:20;
}

/* big speech-bubble style input wrapper */
.input-panel{
  max-width:720px;
  margin:0 auto;
  background:var(--paper);
  border:3px solid var(--paper);
  border-radius:16px;
  padding:8px 8px 8px 14px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  box-shadow:0 0 0 3px var(--ink);
  position:relative;
  transition:box-shadow .15s;
}
.input-panel:focus-within{
  box-shadow:0 0 0 3px var(--red);
}

#user-input{
  flex:1;
  background:transparent;
  border:none;
  outline:none;
  color:var(--ink);
  font-family:var(--comic);
  font-weight:700;
  font-size:15px;
  resize:none;
  max-height:130px;
  min-height:24px;
  line-height:1.5;
  padding:2px 0;
  -webkit-appearance:none;
}
#user-input::placeholder{color:#bbb;font-weight:400}

/* SEND BUTTON — comic POW style */
#send-btn{
  width:44px;height:44px;
  border-radius:50%;
  border:3px solid var(--ink);
  background:var(--yellow);
  color:var(--ink);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  box-shadow:var(--shadow-sm);
  transition:all .12s;
  position:relative;
  overflow:hidden;
}
#send-btn:hover{
  background:var(--red2);
  color:#fff;
  border-color:var(--ink);
  transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 var(--ink);
}
#send-btn:active{transform:translate(1px,1px);box-shadow:0 0 0 var(--ink)}
#send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
#send-btn svg{width:18px;height:18px;position:relative;z-index:1}

.input-hint{
  max-width:720px;
  margin:6px auto 0;
  font-size:10px;
  color:#888;
  font-family:var(--mono);
  text-align:center;
}

/* ─── TOAST ─── */
#toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--red);
  border:3px solid var(--ink);
  color:#fff;
  padding:9px 18px;
  border-radius:10px;
  font-family:var(--title);
  font-size:15px;
  letter-spacing:.5px;
  opacity:0;
  pointer-events:none;
  z-index:999;
  max-width:88vw;
  text-align:center;
  box-shadow:var(--shadow);
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  white-space:pre-wrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#006622}

/* ─── AI text formatting ─── */
.ai-bubble strong{color:var(--red);font-weight:700}
.ai-bubble em{color:#666;font-style:italic}
.ai-bubble p{margin-bottom:.4rem}
.ai-bubble p:last-child{margin-bottom:0}

/* ─── RESPONSIVE ─── */
@media(max-width:480px){
  .logo-text{font-size:22px}
  header{padding:0 10px;height:54px}
  .input-area{padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .user-bubble,.ai-bubble{font-size:14px}
  #send-btn{width:40px;height:40px}
  .msg-row.user{padding-left:28px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-skull">🐛</div>
    <span class="logo-text">Worm<em>GPT</em></span>
  </div>
  <div class="header-right">
    <div class="online-pill">
      <div class="online-dot"></div>
      LIVE
    </div>
    <button class="btn-trash" onclick="clearChat()" title="Hapus chat">🗑️</button>
  </div>
</header>

<!-- MESSAGES -->
<div id="messages">
  <div id="empty-state">
    <div class="empty-panel">
      <span class="empty-worm">🐛</span>
      <div class="empty-title">WORMGPT!</div>
      <div class="empty-sub">AI tanpa sensor. Tanya apapun, jawab semuanya.</div>
      <div class="zap-line">⚡ MULAI DARI SINI ⚡</div>
      <div class="chips">
        <div class="chip" onclick="quickSend('Apa yang bisa kamu lakukan?')">💪 Kemampuanmu?</div>
        <div class="chip" onclick="quickSend('Jelaskan cara kerja AI dengan bahasa sederhana')">🤖 Cara kerja AI</div>
        <div class="chip" onclick="quickSend('Buatkan kode Python hello world dengan penjelasannya')">💻 Kode Python</div>
        <div class="chip" onclick="quickSend('Ceritakan sesuatu yang menarik dan mengejutkan')">✨ Cerita seru</div>
        <div class="chip" onclick="quickSend('Bantu saya menulis email profesional ke atasan')">📧 Tulis email</div>
      </div>
    </div>
  </div>
</div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-panel">
    <textarea id="user-input" rows="1" placeholder="Ketik pesanmu di sini…" maxlength="4000"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Kirim">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">Enter = kirim · Shift+Enter = baris baru</div>
</div>

<div id="toast"></div>

<script>
const API_URL='https://api.wormgpt.pw/v1/chat/completions';
const API_KEY='wgpt_c8ta2acq6ixodl8o3cdn952xhb1fmi9dzaj2uscq';

let history=[];
let isLoading=false;

const messagesEl=document.getElementById('messages');
const inputEl=document.getElementById('user-input');
const sendBtn=document.getElementById('send-btn');

inputEl.addEventListener('input',autoResize);
function autoResize(){
  inputEl.style.height='auto';
  inputEl.style.height=Math.min(inputEl.scrollHeight,130)+'px';
}

inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
});

function toast(msg,type='err'){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='show'+(type==='ok'?' ok':'');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.className='',3500);
}

function now(){
  return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmt(text){
  const parts=text.split(/(```[\s\S]*?```)/g);
  let out='';
  for(const part of parts){
    if(part.startsWith('```')){
      const inner=part.slice(3,-3);
      const nl=inner.indexOf('\n');
      const lang=nl>-1?inner.slice(0,nl).trim():'';
      const code=nl>-1?inner.slice(nl+1):inner;
      const lb=lang?`<span style="font-size:10px;color:var(--red3);display:block;margin-bottom:4px;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px">${esc(lang)}</span>`:'';
      out+=`<div class="pre-wrap">${lb}<pre><code>${esc(code.trimEnd())}</code></pre><button class="copy-btn" onclick="copyCode(this)">SALIN</button></div>`;
    } else {
      let s=esc(part);
      s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
      s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
      s=s.split(/\n\n+/).map(p=>p.trim()?`<p>${p.replace(/\n/g,'<br>')}</p>`:'').join('');
      out+=s;
    }
  }
  return out;
}

function copyCode(btn){
  const code=btn.previousElementSibling.tagName==='SPAN'
    ?btn.parentElement.querySelector('pre code').innerText
    :btn.previousElementSibling.querySelector('code').innerText;
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent='✓ DISALIN!';
    setTimeout(()=>btn.textContent='SALIN',2000);
  });
}

function scrollDown(){
  messagesEl.scrollTo({top:messagesEl.scrollHeight,behavior:'smooth'});
}

function appendUser(text){
  document.getElementById('empty-state')?.remove();
  const row=document.createElement('div');
  row.className='msg-row user';
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;align-items:flex-end';
  const bub=document.createElement('div');
  bub.className='user-bubble';
  bub.textContent=text;
  const ts=document.createElement('div');
  ts.className='msg-time';
  ts.textContent=now();
  wrap.append(bub,ts);
  row.appendChild(wrap);
  messagesEl.appendChild(row);
  scrollDown();
}

function createAIRow(){
  document.getElementById('empty-state')?.remove();
  document.getElementById('typing-row')?.remove();
  const row=document.createElement('div');
  row.className='msg-row ai';
  row.id='stream-row';
  const face=document.createElement('div');
  face.className='ai-face';
  face.textContent='🐛';
  const wrap=document.createElement('div');
  wrap.className='ai-bubble-wrap';
  const bub=document.createElement('div');
  bub.className='ai-bubble';
  bub.id='stream-bub';
  const ts=document.createElement('div');
  ts.className='msg-time';
  ts.id='stream-ts';
  wrap.append(bub,ts);
  row.append(face,wrap);
  messagesEl.appendChild(row);
  scrollDown();
  return bub;
}

function showTyping(){
  document.getElementById('empty-state')?.remove();
  const row=document.createElement('div');
  row.className='typing-row';
  row.id='typing-row';
  row.innerHTML=`
    <div class="think-face">🐛</div>
    <div class="think-bubble">
      <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
    </div>`;
  messagesEl.appendChild(row);
  scrollDown();
}

function buildEmpty(){
  const es=document.createElement('div');
  es.id='empty-state';
  es.innerHTML=`
    <div class="empty-panel">
      <span class="empty-worm">🐛</span>
      <div class="empty-title">WORMGPT!</div>
      <div class="empty-sub">AI tanpa sensor. Tanya apapun, jawab semuanya.</div>
      <div class="zap-line">⚡ MULAI DARI SINI ⚡</div>
      <div class="chips">
        <div class="chip" onclick="quickSend('Apa yang bisa kamu lakukan?')">💪 Kemampuanmu?</div>
        <div class="chip" onclick="quickSend('Jelaskan cara kerja AI dengan bahasa sederhana')">🤖 Cara kerja AI</div>
        <div class="chip" onclick="quickSend('Buatkan kode Python hello world dengan penjelasannya')">💻 Kode Python</div>
        <div class="chip" onclick="quickSend('Ceritakan sesuatu yang menarik dan mengejutkan')">✨ Cerita seru</div>
        <div class="chip" onclick="quickSend('Bantu saya menulis email profesional ke atasan')">📧 Tulis email</div>
      </div>
    </div>`;
  return es;
}

function clearChat(){
  history=[];
  messagesEl.innerHTML='';
  messagesEl.appendChild(buildEmpty());
}

function quickSend(t){inputEl.value=t;autoResize();sendMessage()}

function extractContent(jsonStr){
  if(!jsonStr||jsonStr==='[DONE]')return'';
  try{
    const o=JSON.parse(jsonStr);
    if(typeof o.content==='string')return o.content;
    if(o.choices?.[0]?.delta?.content!=null)return o.choices[0].delta.content;
    if(o.choices?.[0]?.message?.content!=null)return o.choices[0].message.content;
    if(o.choices?.[0]?.text!=null)return o.choices[0].text;
  }catch(_){}
  return'';
}

async function sendMessage(){
  const text=inputEl.value.trim();
  if(!text||isLoading)return;

  isLoading=true;
  sendBtn.disabled=true;
  inputEl.value='';
  inputEl.style.height='auto';

  appendUser(text);
  history.push({role:'user',content:text});
  showTyping();

  let fullReply='';
  let textEl=null;

  try{
    const res=await fetch(API_URL,{
      method:'POST',
      headers:{'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'wormgpt-uncensored',
        messages:history,
        stream:true,
        temperature:0.75,
        max_tokens:1200
      })
    });

    if(!res.ok){
      const e=await res.text();
      throw new Error('HTTP '+res.status+' — '+e.slice(0,180));
    }

    const reader=res.body.getReader();
    const dec=new TextDecoder('utf-8');
    let buf='';

    while(true){
      const{value,done}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop();
      for(const line of lines){
        const t=line.trim();
        if(!t.startsWith('data:'))continue;
        const chunk=extractContent(t.slice(5).trim());
        if(!chunk)continue;
        fullReply+=chunk;
        if(!textEl)textEl=createAIRow();
        textEl.innerHTML=fmt(fullReply);
        scrollDown();
      }
    }

    if(buf.trim().startsWith('data:')){
      const chunk=extractContent(buf.trim().slice(5).trim());
      if(chunk){fullReply+=chunk;if(!textEl)textEl=createAIRow();textEl.innerHTML=fmt(fullReply)}
    }

    if(!fullReply)fullReply='_(tidak ada respons dari server)_';
    if(!textEl)textEl=createAIRow();
    textEl.innerHTML=fmt(fullReply);

    const tsEl=document.getElementById('stream-ts');
    if(tsEl)tsEl.textContent=now();

    document.getElementById('stream-row')?.removeAttribute('id');
    document.getElementById('stream-bub')?.removeAttribute('id');
    document.getElementById('stream-ts')?.removeAttribute('id');

    history.push({role:'assistant',content:fullReply});

  }catch(err){
    document.getElementById('typing-row')?.remove();
    document.getElementById('stream-row')?.remove();
    toast('💥 '+( err.message||'Gagal konek ke server'));
    history.pop();
  }

  isLoading=false;
  sendBtn.disabled=false;
  inputEl.focus();
}
</script>
